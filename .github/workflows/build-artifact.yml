name: Build Artifact

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch: {}

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.new_tag }}
            version: ${{ steps.version.outputs.version }}

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Use Node.js latest
              uses: actions/setup-node@v4
              with:
                  node-version: latest
                  cache: npm

            - run: npm ci

            - name: Compute next version from tags
              id: tag
              uses: anothrNick/github-tag-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WITH_V: true
                  DEFAULT_BUMP: patch
                  INITIAL_VERSION: 15.0.2
                  RELEASE_BRANCHES: master
                  DRY_RUN: true

            - name: Set package.json version to computed tag
              id: version
              env:
                  TAG: ${{ steps.tag.outputs.new_tag }}
              run: |
                  VERSION=${TAG#v}
                  npm version "$VERSION" --no-git-tag-version --allow-same-version
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - run: npm run build

            - name: Pack npm package
              run: npm pack

            - name: Upload build output
              uses: actions/upload-artifact@v4
              with:
                  name: lib
                  path: lib/
                  if-no-files-found: error

            - name: Upload npm package tarball
              uses: actions/upload-artifact@v4
              with:
                  name: nestjs-paginate-package
                  path: '*.tgz'
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Create and push tag
              run: |
                  git tag ${{ needs.build.outputs.tag }}
                  git push origin ${{ needs.build.outputs.tag }}

            - name: Download npm package tarball
              uses: actions/download-artifact@v4
              with:
                  name: nestjs-paginate-package

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.build.outputs.tag }}
                  files: '*.tgz'
                  generate_release_notes: true
                  name: ${{ needs.build.outputs.tag }}
